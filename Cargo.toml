[package]
name = "aniworld-cli-rust"
version = "0.2.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
description = "Fast, native Rust terminal client for AniWorld anime streaming with mpv integration"
repository = "https://github.com/deactivated0/aniworld-cli-rust"
keywords = ["anime", "aniworld", "cli", "mpv", "streaming"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "aniworld"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.15"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip"] }
scraper = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
